# Plantilla de GitHub Action para el repositorio primario (egofer/meteoriotuerto)
# Ubicación en el repositorio primario: .github/workflows/notify_web.yml
# Requiere el secreto de repositorio: DISPATCH_TOKEN

name: Notificar actualización de datos a MeteoRiotuerto Web

on:
  push:
    branches:
      - main
    paths:
      - '**/data/*.csv'
  workflow_dispatch:

jobs:
  notify_web_repo:
    name: Disparar sincronización en meteoriotuerto-web
    runs-on: ubuntu-latest
    steps:
      - name: Enviar evento repository_dispatch a egofer/meteoriotuerto-web
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/egofer/meteoriotuerto-web/dispatches \
            -d '{"event_type":"meteoriotuerto_data_updated","client_payload":{"commit":"${{ github.sha }}"}}'
